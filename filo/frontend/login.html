<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAC365 Filo - Giriş</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .login-header {
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .login-header i {
            font-size: 4rem;
            margin-bottom: 15px;
        }
        
        .login-header h2 {
            font-size: 2rem;
            margin-bottom: 5px;
        }
        
        .login-header p {
            opacity: 0.9;
        }
        
        .login-tabs {
            display: flex;
            border-bottom: 1px solid #e1e5eb;
        }
        
        .login-tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            background: #f8f9fa;
        }
        
        .login-tab.active {
            background: white;
            color: #3498db;
            border-bottom: 3px solid #3498db;
        }
        
        .login-tab i {
            margin-right: 8px;
        }
        
        .login-body {
            padding: 30px;
        }
        
        .form-container {
            display: block;
        }
        
        .form-container.hidden {
            display: none;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group label i {
            color: #3498db;
            margin-right: 8px;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5eb;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 3px rgba(52,152,219,0.2);
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(52,152,219,0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(46,204,113,0.4);
        }
        
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        
        .message.error {
            background: #fee;
            color: #c0392b;
            border-left: 4px solid #e74c3c;
            display: block;
        }
        
        .message.success {
            background: #e8f8f5;
            color: #27ae60;
            border-left: 4px solid #2ecc71;
            display: block;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-truck-moving"></i>
                <h2>EAC365 FİLO</h2>
                <p>Profesyonel Filo Yönetim Sistemi</p>
            </div>
            
            <div class="login-tabs">
                <div class="login-tab active" id="loginTab">
                    <i class="fas fa-sign-in-alt"></i> Giriş Yap
                </div>
                <div class="login-tab" id="registerTab">
                    <i class="fas fa-user-plus"></i> Kayıt Ol
                </div>
            </div>
            
            <div class="login-body">
                <!-- GİRİŞ FORMU -->
                <div id="loginForm" class="form-container">
                    <form id="loginFormElement">
                        <div class="form-group">
                            <label><i class="fas fa-envelope"></i> E-posta</label>
                            <input type="email" id="loginEmail" class="form-control" value="" required>
                        </div>
                        
                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> Şifre</label>
                            <input type="password" id="loginPassword" class="form-control" value="" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-sign-in-alt"></i> Giriş Yap
                        </button>
                        
                        <div id="loginMessage" class="message"></div>
                    </form>
                </div>
                
                <!-- KAYIT FORMU -->
                <div id="registerForm" class="form-container hidden">
                    <form id="registerFormElement">
                        <div class="form-row">
                            <div class="form-group">
                                <label><i class="fas fa-user"></i> Ad</label>
                                <input type="text" id="registerName" class="form-control" required>
                            </div>
                            
                            <div class="form-group">
                                <label><i class="fas fa-user"></i> Soyad</label>
                                <input type="text" id="registerSurname" class="form-control" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label><i class="fas fa-building"></i> Firma</label>
                            <input type="text" id="registerCompany" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label><i class="fas fa-envelope"></i> E-posta</label>
                            <input type="email" id="registerEmail" class="form-control" required>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label><i class="fas fa-phone"></i> Telefon</label>
                                <input type="tel" id="registerPhone" class="form-control">
                            </div>
                            
                            <div class="form-group">
                                <label><i class="fas fa-id-card"></i> TC Kimlik</label>
                                <input type="text" id="registerTc" class="form-control" maxlength="11">
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label><i class="fas fa-lock"></i> Şifre</label>
                                <input type="password" id="registerPassword" class="form-control" required>
                            </div>
                            
                            <div class="form-group">
                                <label><i class="fas fa-lock"></i> Şifre Tekrar</label>
                                <input type="password" id="registerPasswordConfirm" class="form-control" required>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-user-plus"></i> Kayıt Ol
                        </button>
                        
                        <div id="registerMessage" class="message"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Tab geçişi - element ID'leri ile
        document.getElementById('loginTab').addEventListener('click', function() {
            document.getElementById('loginTab').classList.add('active');
            document.getElementById('registerTab').classList.remove('active');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
        });
        
        document.getElementById('registerTab').addEventListener('click', function() {
            document.getElementById('registerTab').classList.add('active');
            document.getElementById('loginTab').classList.remove('active');
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('loginForm').classList.add('hidden');
        });
        
        // GİRİŞ İŞLEMİ
        document.getElementById('loginFormElement').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const messageEl = document.getElementById('loginMessage');
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('eac_token', data.token);
                    messageEl.className = 'message success';
                    messageEl.textContent = 'Giriş başarılı! Yönlendiriliyor...';
                    setTimeout(() => {
                        window.location.href = '/panel';
                    }, 1000);
                } else {
                    messageEl.className = 'message error';
                    messageEl.textContent = data.error || 'Giriş başarısız!';
                }
            } catch (error) {
                messageEl.className = 'message error';
                messageEl.textContent = 'Sunucuya bağlanılamadı!';
            }
        });
        
        // KAYIT İŞLEMİ
        document.getElementById('registerFormElement').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('registerName').value;
            const surname = document.getElementById('registerSurname').value;
            const company = document.getElementById('registerCompany').value;
            const email = document.getElementById('registerEmail').value;
            const phone = document.getElementById('registerPhone').value;
            const tc_no = document.getElementById('registerTc').value;
            const password = document.getElementById('registerPassword').value;
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value;
            const messageEl = document.getElementById('registerMessage');
            
            // Şifre kontrolü
            if (password !== passwordConfirm) {
                messageEl.className = 'message error';
                messageEl.textContent = 'Şifreler eşleşmiyor!';
                return;
            }
            
            if (password.length < 6) {
                messageEl.className = 'message error';
                messageEl.textContent = 'Şifre en az 6 karakter olmalı!';
                return;
            }
            
            const fullName = name + ' ' + surname;
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        name: fullName,
                        company,
                        email,
                        phone,
                        tc_no,
                        password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    messageEl.className = 'message success';
                    messageEl.textContent = 'Kayıt başarılı! Giriş yapabilirsiniz.';
                    
                    // Formu temizle ve login tab'ına geç
                    setTimeout(() => {
                        document.getElementById('loginTab').click();
                        document.getElementById('loginEmail').value = email;
                        document.getElementById('loginPassword').value = '';
                    }, 2000);
                } else {
                    messageEl.className = 'message error';
                    messageEl.textContent = data.error || 'Kayıt başarısız!';
                }
            } catch (error) {
                messageEl.className = 'message error';
                messageEl.textContent = 'Sunucuya bağlanılamadı!';
            }
        });
    </script>
</body>
</html>
